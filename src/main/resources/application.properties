spring.application.name=movie-relay-backend
spring.profiles.active=local

tdlib.data-path=./tdlib-data

# Persist the library database to disk (inside the git-ignored tdlib-data folder)
# instead of the default in-memory H2, so downloaded-file records survive restarts.
spring.datasource.url=jdbc:h2:file:./tdlib-data/library-db;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update

# Username (without @) of the Telegram bot this app talks to.
# Change this single line to switch to a different bot at any time.
telegram.movie-bot-username=iPapkornX2bot

logging.level.it.tdlight=WARN

# ffmpeg/ffprobe executables, used to extract embedded subtitle tracks from downloaded MKV
# files as WebVTT for the player. Defaults assume both are on PATH - override here (or in
# application-local.properties) with a full path if that's not the case on your machine.
ffmpeg.ffmpeg-path=ffmpeg
ffmpeg.ffprobe-path=ffprobe
